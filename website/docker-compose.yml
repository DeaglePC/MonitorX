services:
  monitorx-site:
    build: .
    image: monitorx-site:latest
    container_name: monitorx-site
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    # Optional local files; the landing page downloads installers from GitHub Releases
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
