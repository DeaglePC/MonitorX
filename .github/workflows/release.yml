# Builds the direct-distribution edition when a version tag is pushed and attaches it to a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Signing and notarization are optional: without the secrets below the release gets an ad-hoc signed build
# (users must run `xattr -cr /Applications/MonitorX.app` once). Repository secrets:
#   MACOS_CERT_P12        base64 of the exported "Developer ID Application" certificate + private key (.p12)
#   MACOS_CERT_PASSWORD   password chosen when exporting the .p12
#   NOTARY_KEY            contents of the App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID         that key's ID
#   NOTARY_ISSUER         the Issuer ID shown above the key list in App Store Connect
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26   # the app needs the macOS 26 SDK (Liquid Glass)
    timeout-minutes: 120   # a team's first notarizations can take Apple well over 30 minutes
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::warning::MACOS_CERT_P12 not set: publishing an ad-hoc signed, non-notarized build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Sign by SHA-1 so the exact certificate name doesn't need to be configured anywhere.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize and package
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export VERSION="${TAG#v}"
          export BUILD_NUMBER="${{ github.run_number }}"
          export NOTARY_TIMEOUT=50m   # per submission (app, then dmg); keeps both within the job timeout
          if [[ -n "$SIGN_IDENTITY" && -n "$NOTARY_KEY" ]]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          elif [[ -n "$SIGN_IDENTITY" ]]; then
            echo "::warning::NOTARY_KEY not set: the build is signed but not notarized."
          fi
          Scripts/release.sh
          cd dist && shasum -a 256 MonitorX-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          FILES=(dist/MonitorX-"$VERSION".dmg dist/MonitorX-"$VERSION".zip dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            PRERELEASE=()
            [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)   # v1.2.0-beta.1 etc.
            gh release create "$TAG" "${FILES[@]}" --title "MonitorX $VERSION" --generate-notes --verify-tag "${PRERELEASE[@]}"
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
